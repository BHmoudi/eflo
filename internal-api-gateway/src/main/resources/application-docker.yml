# ======================================================
# Internal API Gateway - Docker Profile
# ======================================================

spring:
  data:
    redis:
      host: redis
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8180/realms/eflo/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    hostname: internal-gateway
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.eflo.gateway: INFO
