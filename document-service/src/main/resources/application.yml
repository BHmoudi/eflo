spring:
  application:
    name: document-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/document_db
    username: ${DB_USERNAME:document_user}
    password: ${DB_PASSWORD:document_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: document-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/eflo/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8083}
  error:
    include-message: always
    include-binding-errors: always
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_ENABLED:false}
    fetch-registry: ${EUREKA_ENABLED:false}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    metadata-map:
      version: ${spring.application.version:1.0.0}
      service-type: document

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    documents: ${MINIO_BUCKET_DOCUMENTS:eflo-documents}
    temp: ${MINIO_BUCKET_TEMP:eflo-temp}
    archive: ${MINIO_BUCKET_ARCHIVE:eflo-archive}
  secure: ${MINIO_SECURE:false}
  connect-timeout: 10000
  write-timeout: 60000
  read-timeout: 30000

# ClamAV Virus Scanner Configuration
clamav:
  enabled: ${CLAMAV_ENABLED:true}
  host: ${CLAMAV_HOST:localhost}
  port: ${CLAMAV_PORT:3310}
  timeout: 30000
  platform: ${CLAMAV_PLATFORM:unix}

# Document Service Configuration
eflo:
  document:
    # File Upload Settings
    upload:
      max-file-size-mb: 100
      allowed-extensions:
        - pdf
        - jpg
        - jpeg
        - png
        - doc
        - docx
        - xls
        - xlsx
      blocked-extensions:
        - exe
        - bat
        - sh
        - com
        - cmd
      allowed-mime-types:
        - application/pdf
        - image/jpeg
        - image/png
        - application/msword
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.ms-excel
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

    # Validation Settings
    validation:
      auto-validate-max-size-mb: 10
      require-virus-scan: true
      scan-timeout-seconds: 30
      block-on-scan-failure: true

    # Expiration Management
    expiration:
      check-cron: "0 0 2 * * ?" # 2 AM daily
      warning-days: 30
      auto-archive-expired: true
      notification-enabled: true

    # Cleanup Settings
    cleanup:
      temp-files-cron: "0 0 3 * * ?" # 3 AM daily
      temp-files-retention-hours: 24
      deleted-files-retention-days: 30

    # Storage Settings
    storage:
      path-pattern: "orders/{year}/{month}/{orderNumber}/{documentType}/{filename}"
      temp-path-pattern: "temp/{documentType}/{uuid}/{filename}"
      archive-path-pattern: "archive/{year}/{orderId}/{documentType}/{filename}"
      enable-versioning: true
      max-versions: 10

    # Search Settings
    search:
      max-results: 1000
      default-page-size: 50

    # Security Settings
    security:
      scan-all-uploads: true
      require-authentication: true
      audit-all-access: true
      encrypt-sensitive-metadata: false

# Feign Client Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: basic
      order-service:
        url: ${ORDER_SERVICE_URL:http://localhost:8081}
      workflow-service:
        url: ${WORKFLOW_SERVICE_URL:http://localhost:8082}
      user-service:
        url: ${USER_SERVICE_URL:http://localhost:8085}

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      order-service:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
      workflow-service:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
      clamav-scanner:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 60
        record-exceptions:
          - java.io.IOException
          - java.net.ConnectException
          - java.net.SocketTimeoutException

  retry:
    instances:
      document-service:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException

# Logging Configuration
logging:
  level:
    root: INFO
    com.eflo.document: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.kafka: INFO
    com.eflo.document.web.filter.RequestResponseLoggingFilter: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{correlationId}] [%X{userId}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{correlationId}] [%X{userId}] - %msg%n"
  request-response:
    enabled: true
    include-headers: true
    include-payload: true
    max-payload-length: 1000
  file:
    name: logs/document-service.log
    max-size: 10MB
    max-history: 30
