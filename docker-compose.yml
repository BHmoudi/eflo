# ═══════════════════════════════════════════════════════════════════
# Eflo Microservices - Docker Compose
# ═══════════════════════════════════════════════════════════════════
# Services included:
# - Infrastructure: Eureka Server, Config Server, Keycloak, n8n
# - Gateways: Internal & External API Gateways
# - Business Services: Order, Workflow, Commission, Document, User
# - Storage: PostgreSQL, Kafka, Zookeeper, MinIO
# - Automation: n8n (Workflow Automation & Integration Platform)
# ═══════════════════════════════════════════════════════════════════

networks:
  eflo-network:
    driver: bridge

volumes:
  # PostgreSQL databases
  keycloak_postgres_data:
  postgres_order_data:
  postgres_workflow_data:
  postgres_commission_data:
  postgres_document_data:
  postgres_docgen_data:
  postgres_user_data:
  n8n_postgres_data:

  # Messaging
  kafka_data:
  zookeeper_data:

  # Storage
  minio_data:
  n8n_data:

services:
  # ═══════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE SERVICES
  # ═══════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────────
  # Eureka Server - Service Discovery (8761)
  # ─────────────────────────────────────────────────────────────────
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    hostname: eureka-server
    image: eflo/eureka-server:1.0.0
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_REGISTERWITHEUREKA=false
      - EUREKA_CLIENT_FETCHREGISTRY=false
      - EUREKA_USERNAME=${EUREKA_USERNAME:-eureka}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD:-eurekapass}
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Zookeeper - Kafka Coordination (2181)
  # ─────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Kafka - Event Streaming (9092)
  # ─────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Config Server - Centralized Configuration (8888)
  # ─────────────────────────────────────────────────────────────────
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    hostname: config-server
    image: eflo/config-server:1.0.0
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=docker,native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCHLOCATIONS=classpath:/config
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD:-eurekapass}@eureka-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Keycloak PostgreSQL Database
  # ─────────────────────────────────────────────────────────────────
  postgres-keycloak:
    image: postgres:15-alpine
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Keycloak - Identity & Access Management (8180)
  # ─────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: keycloak
    command: start-dev --import-realm
    ports:
      - "8180:8180"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_PORT: 8180
      KC_HOSTNAME_URL: http://localhost:8180
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
    volumes:
      - ./keycloak-setup/config:/opt/keycloak/data/import
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8180 && echo 'Keycloak is up' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # API GATEWAYS
  # ═══════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────────
  # Internal API Gateway (8080)
  # ─────────────────────────────────────────────────────────────────
  internal-api-gateway:
    build:
      context: ./internal-api-gateway
      dockerfile: Dockerfile
    container_name: internal-api-gateway
    image: eflo/internal-api-gateway:1.0.0
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD:-eurekapass}@eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8180/realms/eflo/protocol/openid-connect/certs
      - GATEWAY_AUTH_ENFORCE=false
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # External API Gateway (8081)
  # ─────────────────────────────────────────────────────────────────
  external-api-gateway:
    build:
      context: ./external-api-gateway
      dockerfile: Dockerfile
    container_name: external-api-gateway
    image: eflo/external-api-gateway:1.0.0
    ports:
      - "8079:8079"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD:-eurekapass}@eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8180/realms/eflo/protocol/openid-connect/certs
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8079/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # BUSINESS MICROSERVICES
  # ═══════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────────
  # Order Service Database
  # ─────────────────────────────────────────────────────────────────
  postgres-order:
    image: postgres:15-alpine
    container_name: postgres-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Order Service (8089)
  # ─────────────────────────────────────────────────────────────────
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    image: eflo/order-service:1.0.0
    ports:
      - "8089:8089"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-order:5432/order_db
      - SPRING_DATASOURCE_PASSWORD=${ORDER_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD:-eurekapass}@eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8180/realms/eflo/protocol/openid-connect/certs
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Workflow Service Database
  # ─────────────────────────────────────────────────────────────────
  postgres-workflow:
    image: postgres:15-alpine
    container_name: postgres-workflow
    environment:
      POSTGRES_DB: workflow_db
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: ${WORKFLOW_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_workflow_data:/var/lib/postgresql/data
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Workflow Service (8091)
  # ─────────────────────────────────────────────────────────────────
  workflow-service:
    build:
      context: ./workflow-service
      dockerfile: Dockerfile
    container_name: workflow-service
    image: eflo/workflow-service:1.0.0
    ports:
      - "8091:8091"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-workflow:5432/workflow_db
      - SPRING_DATASOURCE_PASSWORD=${WORKFLOW_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD:-eurekapass}@eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8180/realms/eflo/protocol/openid-connect/certs
    depends_on:
      postgres-workflow:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Commission Service Database
  # ─────────────────────────────────────────────────────────────────
  postgres-commission:
    image: postgres:15-alpine
    container_name: postgres-commission
    environment:
      POSTGRES_DB: commission_db
      POSTGRES_USER: commission_user
      POSTGRES_PASSWORD: ${COMMISSION_DB_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - postgres_commission_data:/var/lib/postgresql/data
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commission_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Commission Service (8082)
  # ─────────────────────────────────────────────────────────────────
  commission-service:
    build:
      context: ./commission-service
      dockerfile: Dockerfile
    container_name: commission-service
    image: eflo/commission-service:1.0.0
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-commission:5432/commission_db
      - SPRING_DATASOURCE_PASSWORD=${COMMISSION_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD:-eurekapass}@eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8180/realms/eflo/protocol/openid-connect/certs
    depends_on:
      postgres-commission:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # MinIO - S3-Compatible Object Storage (9000, 9001)
  # ─────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Document Service Database
  # ─────────────────────────────────────────────────────────────────
  postgres-document:
    image: postgres:15-alpine
    container_name: postgres-document
    environment:
      POSTGRES_DB: document_db
      POSTGRES_USER: document_user
      POSTGRES_PASSWORD: ${DOCUMENT_DB_PASSWORD}
    ports:
      - "5437:5432"
    volumes:
      - postgres_document_data:/var/lib/postgresql/data
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Document Service (8083)
  # ─────────────────────────────────────────────────────────────────
  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: document-service
    image: eflo/document-service:1.0.0
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-document:5432/document_db
      - SPRING_DATASOURCE_PASSWORD=${DOCUMENT_DB_PASSWORD}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD:-eurekapass}@eureka-server:8761/eureka/
      - EUREKA_ENABLED=true
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8180/realms/eflo/protocol/openid-connect/certs
    depends_on:
      postgres-document:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Document Generation Service Database
  # ─────────────────────────────────────────────────────────────────
  postgres-docgen:
    image: postgres:15-alpine
    container_name: postgres-docgen
    environment:
      POSTGRES_DB: docgen_db
      POSTGRES_USER: docgen_user
      POSTGRES_PASSWORD: ${DOCGEN_DB_PASSWORD:-docgenpass}
    ports:
      - "5440:5432"
    volumes:
      - postgres_docgen_data:/var/lib/postgresql/data
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docgen_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Document Generation Service (8085)
  # ─────────────────────────────────────────────────────────────────
  document-generation-service:
    build:
      context: ./document-generation-service
      dockerfile: Dockerfile
    container_name: document-generation-service
    image: eflo/document-generation-service:1.0.0
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-docgen:5432/docgen_db
      - SPRING_DATASOURCE_PASSWORD=${DOCGEN_DB_PASSWORD:-docgenpass}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD:-eurekapass}@eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8180/realms/eflo/protocol/openid-connect/certs
    depends_on:
      postgres-docgen:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # User Service Database
  # ─────────────────────────────────────────────────────────────────
  postgres-user:
    image: postgres:15-alpine
    container_name: postgres-user
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "5438:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # User Service (8084)
  # ─────────────────────────────────────────────────────────────────
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    image: eflo/user-service:1.0.0
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-user:5432/user_db
      - SPRING_DATASOURCE_PASSWORD=${USER_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://${EUREKA_USERNAME:-eureka}:${EUREKA_PASSWORD:-eurekapass}@eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8180/realms/eflo/protocol/openid-connect/certs
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8180
      - KEYCLOAK_REALM=eflo
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      postgres-user:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # AUTOMATION & WORKFLOW ORCHESTRATION
  # ═══════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────────
  # n8n PostgreSQL Database
  # ─────────────────────────────────────────────────────────────────
  postgres-n8n:
    image: postgres:15-alpine
    container_name: postgres-n8n
    environment:
      POSTGRES_DB: n8n_db
      POSTGRES_USER: n8n_user
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    ports:
      - "5439:5432"
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # n8n - Workflow Automation Platform (5678)
  # ─────────────────────────────────────────────────────────────────
  # Features:
  # - AI Document Analysis Integration
  # - WhatsApp Messaging (Send/Receive)
  # - Task Validation & Automation
  # - File Reception & Processing
  # - 400+ Pre-built Integrations
  # ─────────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      # Database Configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres-n8n
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_db
      - DB_POSTGRESDB_USER=n8n_user
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}

      # n8n Basic Configuration
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}

      # Authentication & Security
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}

      # Timezone & Localization
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris

      # Integration with Eflo Services
      - N8N_WORKFLOW_SERVICE_URL=http://workflow-service:8091
      - N8N_DOCUMENT_SERVICE_URL=http://document-service:8083
      - N8N_USER_SERVICE_URL=http://user-service:8084
      - N8N_ORDER_SERVICE_URL=http://order-service:8089

      # AI & Document Analysis Configuration
      - N8N_AI_ENABLED=true
      - N8N_AI_PROVIDER=${N8N_AI_PROVIDER:-openai}
      - N8N_AI_API_KEY=${N8N_AI_API_KEY}
      - N8N_AI_MODEL=${N8N_AI_MODEL:-gpt-4}

      # WhatsApp Integration (via Twilio or WhatsApp Business API)
      - N8N_WHATSAPP_ENABLED=true
      - N8N_WHATSAPP_PROVIDER=${N8N_WHATSAPP_PROVIDER:-twilio}
      - N8N_TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - N8N_TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - N8N_TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER}

      # MinIO Integration for File Storage
      - N8N_MINIO_ENDPOINT=http://minio:9000
      - N8N_MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - N8N_MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}

      # Kafka Integration for Event-Driven Workflows
      - N8N_KAFKA_BROKERS=kafka:29092

      # Execution Configuration
      - EXECUTIONS_PROCESS=main
      - EXECUTIONS_MODE=regular
      - EXECUTIONS_TIMEOUT=3600
      - EXECUTIONS_TIMEOUT_MAX=7200
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true

      # Workflow Configuration
      - WORKFLOWS_DEFAULT_NAME=Eflo Workflow
      - N8N_PERSONALIZATION_ENABLED=true

      # Logging
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console

      # Security Headers
      - N8N_SECURE_COOKIE=false

    volumes:
      - n8n_data:/home/node/.n8n
      # Mount custom nodes and workflows
      - ./n8n/custom-nodes:/home/node/.n8n/custom
      - ./n8n/workflows:/home/node/.n8n/workflows
    depends_on:
      postgres-n8n:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
    networks:
      - eflo-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
