spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8180/realms/eflo/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    hostname: external-gateway
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.eflo.external.gateway: INFO
  file:
    name: /app/logs/external-gateway.log
