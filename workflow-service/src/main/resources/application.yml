spring:
  application:
    name: workflow-service

  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5435/workflow_db
    username: workflow_user
    password: ${WORKFLOW_DB_PASSWORD:workflow_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: workflow-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.eflo.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    listener:
      ack-mode: manual

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/eflo/protocol/openid-connect/certs}

server:
  port: 8091
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    metadata-map:
      zone: zone1
      version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

eflo:
  workflow:
    engine:
      enabled: true
      auto-progress: true
      parallel-execution: true
      max-retries: 3

    scheduling:
      deadline-check-interval: 1800000  # 30 minutes
      escalation-check-interval: 3600000  # 1 hour
      cleanup-interval: 86400000  # 24 hours

    escalation:
      enabled: true
      levels:
        - duration-hours: 24
          action: SEND_REMINDER
        - duration-hours: 48
          action: ESCALATE_TO_MANAGER
        - duration-hours: 72
          action: ESCALATE_TO_DIRECTOR
        - duration-hours: 168
          action: ESCALATE_TO_ADMIN

    notifications:
      enabled: true
      channels:
        - EMAIL
        - IN_APP
      templates:
        task-assigned: "Task {taskName} has been assigned to you"
        task-overdue: "Task {taskName} is overdue by {hours} hours"
        instance-overdue: "Workflow instance {instanceId} is overdue"
        escalation: "Workflow {instanceId} has been escalated to {role}"

    performance:
      cache-enabled: true
      cache-ttl-seconds: 300
      batch-size: 100
      async-enabled: true

    integration:
      order-service:
        url: http://localhost:8083
        timeout: 5000
      document-service:
        url: http://localhost:8087
        timeout: 5000
      user-service:
        url: http://localhost:8082
        timeout: 5000

logging:
  level:
    com.eflo.workflow: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.eflo.workflow.web.filter.RequestResponseLoggingFilter: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{correlationId}] [%X{userId}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{correlationId}] [%X{userId}] - %msg%n"
  request-response:
    enabled: true
    include-headers: true
    include-payload: true
    max-payload-length: 1000
