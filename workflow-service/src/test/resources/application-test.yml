spring:
  application:
    name: workflow-service-test

  datasource:
    url: jdbc:tc:postgresql:15:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      auto-offset-reset: earliest
      group-id: test-group

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/eflo-test

eflo:
  workflow:
    engine:
      enabled: true
      auto-progress: true
    scheduling:
      deadline-check-interval: 60000
      escalation-check-interval: 60000
    escalation:
      enabled: true
    notifications:
      enabled: false

logging:
  level:
    com.eflo.workflow: DEBUG
    org.hibernate: INFO
