name: CI - Frontend (Next.js)

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'claude/**'
    paths:
      - 'workflow-admin/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'workflow-admin/**'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  build-and-test:
    name: Build & Test - Workflow Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: ./workflow-admin
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: ./workflow-admin
        run: pnpm run lint

      - name: Run TypeScript type check
        working-directory: ./workflow-admin
        run: pnpm run type-check

      - name: Run unit tests
        working-directory: ./workflow-admin
        run: pnpm run test
        continue-on-error: true

      - name: Build application
        working-directory: ./workflow-admin
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow-admin-build
          path: workflow-admin/.next
          retention-days: 7

  e2e-tests:
    name: E2E Tests - Workflow Admin
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: ./workflow-admin
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ./workflow-admin
        run: pnpm exec playwright install --with-deps
        continue-on-error: true

      - name: Run Playwright tests
        working-directory: ./workflow-admin
        run: pnpm exec playwright test
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: workflow-admin/playwright-report/
          retention-days: 7

  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: ./workflow-admin
        run: pnpm install --frozen-lockfile

      - name: Build for production
        working-directory: ./workflow-admin
        run: pnpm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3001
          configPath: './workflow-admin/lighthouserc.json'
          temporaryPublicStorage: true
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

  build-summary:
    name: Frontend Build Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e-tests, lighthouse-audit]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "Frontend build and test jobs completed"
          echo "Build Status: ${{ needs.build-and-test.result }}"
          echo "E2E Tests Status: ${{ needs.e2e-tests.result }}"
          echo "Lighthouse Audit Status: ${{ needs.lighthouse-audit.result }}"

      - name: Notify on failure
        if: needs.build-and-test.result == 'failure'
        run: |
          echo "::error::Frontend build or tests failed"
          exit 1
