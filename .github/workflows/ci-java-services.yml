name: CI - Java Services

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'claude/**'
    paths:
      - '**-service/**'
      - '**-gateway/**'
      - '**-server/**'
      - '.github/workflows/ci-java-services.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**-service/**'
      - '**-gateway/**'
      - '**-server/**'

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: -Xmx3072m

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            eureka-server:
              - 'eureka-server/**'
            config-server:
              - 'config-server/**'
            internal-api-gateway:
              - 'internal-api-gateway/**'
            external-api-gateway:
              - 'external-api-gateway/**'
            order-service:
              - 'order-service/**'
            workflow-service:
              - 'workflow-service/**'
            commission-service:
              - 'commission-service/**'
            document-service:
              - 'document-service/**'
            document-generation-service:
              - 'document-generation-service/**'
            user-service:
              - 'user-service/**'

  build-and-test:
    name: Build & Test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: mvn clean compile -DskipTests

      - name: Run unit tests
        working-directory: ./${{ matrix.service }}
        run: mvn test -Dtest=!*Integration*

      - name: Run integration tests
        working-directory: ./${{ matrix.service }}
        run: mvn test -Dtest=*Integration*
        continue-on-error: true

      - name: Package application
        working-directory: ./${{ matrix.service }}
        run: mvn package -DskipTests

      - name: Generate test coverage report
        working-directory: ./${{ matrix.service }}
        run: mvn jacoco:report
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/site/jacoco/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ${{ matrix.service }}/target/*.jar
          retention-days: 7

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          for service in eureka-server config-server internal-api-gateway external-api-gateway \
                         order-service workflow-service commission-service document-service \
                         document-generation-service user-service; do
            if [ -d "$service" ]; then
              echo "Analyzing $service..."
              cd "$service"
              mvn sonar:sonar \
                -Dsonar.projectKey=eflo-$service \
                -Dsonar.organization=eflo \
                -Dsonar.host.url=https://sonarcloud.io \
                -Dsonar.login=$SONAR_TOKEN || true
              cd ..
            fi
          done

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Run OWASP Dependency Check
        run: |
          for service in eureka-server config-server internal-api-gateway external-api-gateway \
                         order-service workflow-service commission-service document-service \
                         document-generation-service user-service; do
            if [ -d "$service" ]; then
              echo "Scanning $service for vulnerabilities..."
              cd "$service"
              mvn org.owasp:dependency-check-maven:check || true
              cd ..
            fi
          done

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            **/target/dependency-check-report.html

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, security-scan]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "Build and test jobs completed"
          echo "Build Status: ${{ needs.build-and-test.result }}"
          echo "Code Quality Status: ${{ needs.code-quality.result }}"
          echo "Security Scan Status: ${{ needs.security-scan.result }}"

      - name: Notify on failure
        if: needs.build-and-test.result == 'failure'
        run: |
          echo "::error::One or more services failed to build or test"
          exit 1
