apiVersion: v2
name: eflo-platform
description: Eflo Microservices Platform - Complete deployment chart
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - microservices
  - spring-boot
  - kafka
  - keycloak
  - nextjs
home: https://github.com/BHmoudi/eflo
maintainers:
  - name: Eflo Team
    email: team@eflo.io
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    tags:
      - database
  - name: kafka
    version: "23.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
    tags:
      - messaging
  - name: minio
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
    tags:
      - storage
