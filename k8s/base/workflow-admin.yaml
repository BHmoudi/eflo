apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-admin
  namespace: eflo
  labels:
    app: workflow-admin
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflow-admin
  template:
    metadata:
      labels:
        app: workflow-admin
        tier: frontend
    spec:
      initContainers:
      - name: wait-for-api-gateway
        image: curlimages/curl:latest
        command: ['sh', '-c', 'until curl -f http://internal-api-gateway:8080/actuator/health; do echo waiting for gateway; sleep 5; done;']
      containers:
      - name: workflow-admin
        image: ghcr.io/eflo/workflow-admin:latest
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "http://internal-api-gateway:8080"
        - name: NEXT_PUBLIC_WORKFLOW_SERVICE_URL
          value: "http://workflow-service:8091"
        - name: POSTGRES_HOST
          value: "postgres-workflow"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "workflow_db"
        - name: POSTGRES_USER
          value: "workflow_user"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eflo-secrets
              key: WORKFLOW_DB_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-admin
  namespace: eflo
  labels:
    app: workflow-admin
spec:
  type: LoadBalancer
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: workflow-admin
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workflow-admin-hpa
  namespace: eflo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workflow-admin
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
