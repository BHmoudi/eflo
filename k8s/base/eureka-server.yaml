apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: eflo
  labels:
    app: eureka-server
    tier: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
        tier: infrastructure
    spec:
      containers:
      - name: eureka-server
        image: ghcr.io/eflo/eureka-server:latest
        ports:
        - containerPort: 8761
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "kubernetes"
        - name: EUREKA_CLIENT_REGISTERWITHEUREKA
          value: "false"
        - name: EUREKA_CLIENT_FETCHREGISTRY
          value: "false"
        - name: EUREKA_USERNAME
          valueFrom:
            configMapKeyRef:
              name: eflo-config
              key: EUREKA_USERNAME
        - name: EUREKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eflo-secrets
              key: EUREKA_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8761
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8761
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: eflo
  labels:
    app: eureka-server
spec:
  type: ClusterIP
  ports:
  - port: 8761
    targetPort: 8761
    protocol: TCP
    name: http
  selector:
    app: eureka-server
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server-lb
  namespace: eflo
  labels:
    app: eureka-server
spec:
  type: LoadBalancer
  ports:
  - port: 8761
    targetPort: 8761
    protocol: TCP
    name: http
  selector:
    app: eureka-server
