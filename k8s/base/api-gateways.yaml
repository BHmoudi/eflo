          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: external-api-gateway
  namespace: eflo
  labels:
    app: external-api-gateway
spec:
  type: LoadBalancer
  ports:
  - port: 8081
    targetPort: 8079
    protocol: TCP
    name: http
  selector:
    app: external-api-gateway
