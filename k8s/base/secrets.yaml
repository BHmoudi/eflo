# This is a template file. Actual secrets should be created using:
# kubectl create secret generic eflo-secrets --from-env-file=.env --namespace=eflo
#
# Or use Sealed Secrets / External Secrets Operator for production
#
# For development, you can use this template with base64 encoded values:
# echo -n "password" | base64

apiVersion: v1
kind: Secret
metadata:
  name: eflo-secrets
  namespace: eflo
type: Opaque
data:
  # Database Passwords (base64 encoded)
  KEYCLOAK_DB_PASSWORD: ""  # Replace with base64 encoded password
  ORDER_DB_PASSWORD: ""
  WORKFLOW_DB_PASSWORD: ""
  COMMISSION_DB_PASSWORD: ""
  DOCUMENT_DB_PASSWORD: ""
  USER_DB_PASSWORD: ""
  N8N_DB_PASSWORD: ""
  DOCGEN_DB_PASSWORD: ""

  # Keycloak Admin Credentials
  KEYCLOAK_ADMIN_USERNAME: YWRtaW4=  # admin
  KEYCLOAK_ADMIN_PASSWORD: ""  # Replace with base64 encoded password

  # MinIO Credentials
  MINIO_ROOT_USER: bWluaW9hZG1pbg==  # minioadmin
  MINIO_ROOT_PASSWORD: ""  # Replace with base64 encoded password

  # n8n Configuration
  N8N_BASIC_AUTH_USER: YWRtaW4=  # admin
  N8N_BASIC_AUTH_PASSWORD: ""  # Replace with base64 encoded password
  N8N_AI_API_KEY: ""  # OpenAI API key
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_WHATSAPP_NUMBER: ""

  # Eureka Credentials
  EUREKA_USERNAME: ZXVyZWth  # eureka
  EUREKA_PASSWORD: ""  # Replace with base64 encoded password

---
# Example script to create secrets from .env file:
# kubectl create secret generic eflo-secrets \
#   --from-literal=KEYCLOAK_DB_PASSWORD=$KEYCLOAK_DB_PASSWORD \
#   --from-literal=ORDER_DB_PASSWORD=$ORDER_DB_PASSWORD \
#   --from-literal=WORKFLOW_DB_PASSWORD=$WORKFLOW_DB_PASSWORD \
#   --from-literal=COMMISSION_DB_PASSWORD=$COMMISSION_DB_PASSWORD \
#   --from-literal=DOCUMENT_DB_PASSWORD=$DOCUMENT_DB_PASSWORD \
#   --from-literal=USER_DB_PASSWORD=$USER_DB_PASSWORD \
#   --from-literal=N8N_DB_PASSWORD=$N8N_DB_PASSWORD \
#   --from-literal=DOCGEN_DB_PASSWORD=$DOCGEN_DB_PASSWORD \
#   --from-literal=KEYCLOAK_ADMIN_PASSWORD=$KEYCLOAK_ADMIN_PASSWORD \
#   --from-literal=MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD \
#   --from-literal=N8N_BASIC_AUTH_PASSWORD=$N8N_BASIC_AUTH_PASSWORD \
#   --from-literal=N8N_AI_API_KEY=$N8N_AI_API_KEY \
#   --from-literal=EUREKA_PASSWORD=$EUREKA_PASSWORD \
#   --namespace=eflo
