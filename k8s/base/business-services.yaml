# This file contains all business microservices deployments
# Includes: workflow-service, commission-service, document-service, user-service, document-generation-service

---
# Workflow Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-service
  namespace: eflo
  labels:
    app: workflow-service
    tier: business
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflow-service
  template:
    metadata:
      labels:
        app: workflow-service
        tier: business
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:latest
        command: ['sh', '-c', 'until nc -z postgres-workflow 5432; do sleep 2; done;']
      - name: wait-for-kafka
        image: busybox:latest
        command: ['sh', '-c', 'until nc -z kafka 9092; do sleep 2; done;']
      containers:
      - name: workflow-service
        image: ghcr.io/eflo/workflow-service:latest
        ports:
        - containerPort: 8091
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "kubernetes"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-workflow:5432/workflow_db"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eflo-secrets
              key: WORKFLOW_DB_PASSWORD
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: eflo-config
              key: EUREKA_SERVER_URL
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8091
          initialDelaySeconds: 120
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8091
          initialDelaySeconds: 90
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-service
  namespace: eflo
spec:
  type: ClusterIP
  ports:
  - port: 8091
    targetPort: 8091
  selector:
    app: workflow-service
---
