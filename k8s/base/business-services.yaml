      containers:
      - name: document-generation-service
        image: ghcr.io/eflo/document-generation-service:latest
        ports:
        - containerPort: 8085
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "kubernetes"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-docgen:5432/docgen_db"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eflo-secrets
              key: DOCGEN_DB_PASSWORD
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: eflo-config
              key: EUREKA_SERVER_URL
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8085
          initialDelaySeconds: 90
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8085
          initialDelaySeconds: 60
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: document-generation-service
  namespace: eflo
spec:
  type: ClusterIP
  ports:
  - port: 8085
    targetPort: 8085
  selector:
    app: document-generation-service
---
# Add postgres-docgen StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-docgen
  namespace: eflo
spec:
  serviceName: postgres-docgen
  replicas: 1
  selector:
    matchLabels:
      app: postgres-docgen
  template:
    metadata:
      labels:
        app: postgres-docgen
        tier: database
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "docgen_db"
        - name: POSTGRES_USER
          value: "docgen_user"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eflo-secrets
              key: DOCGEN_DB_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-docgen
  namespace: eflo
spec:
  ports:
  - port: 5432
  selector:
    app: postgres-docgen
  clusterIP: None
